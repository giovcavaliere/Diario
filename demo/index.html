<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=pro02"><link rel="manifest" href="manifest.json"><title>Diario Pro Demo</title></head><body><main class="shell pro-landing"><div class="eyebrow">DIARIO PRO · DEMO V0.2</div><h1>Scegli come entrare</h1><div class="mode-grid"><a class="mode-card" href="patient.html"><b>👤 Area Paziente</b><span>Diario personale completo</span></a><a class="mode-card" href="pro.html"><b>🩺 Area Professionista</b><span>Pazienti, agenda e impostazioni</span></a></div><section class="card"><h2>Importa i tuoi dati</h2><p class="muted">Il backup viene copiato solo nella nuova Demo.</p><button class="primary" id="imp">Importa backup PWA personale</button><input hidden type="file" id="f" accept=".json"><p id="st" class="muted"></p></section></main><script>
const K='diario-pro-patient-main-v1',P='diario-pro-profile-main-v1',M='diario-pro-measures-main-v1';const f=document.getElementById('f');document.getElementById('imp').onclick=()=>f.click();f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),e=Array.isArray(x)?x:x.entries;if(!Array.isArray(e))throw Error('Backup non valido');localStorage.setItem(K,JSON.stringify(e));if(x.profile)localStorage.setItem(P,JSON.stringify(x.profile));if(Array.isArray(x.measurements))localStorage.setItem(M,JSON.stringify(x.measurements));st.textContent='Importate '+e.length+' giornate.'}catch(e){st.textContent=e.message}};r.readAsText(f.files[0])};</script></body></html>
